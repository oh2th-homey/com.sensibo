name: Bug report
description: Something doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't include passwords, API keys, email addresses or other personal details.
  - type: dropdown
    id: device
    attributes:
      label: Device
      description: Which Sensibo device is this about?
      options:
        - Sensibo Sky
        - Sensibo Air / Air Pro
        - Sensibo Pure
        - Sensibo Elements
        - Sensibo Room Sensor
        - Not sure
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Homey app → More → Apps → Sensibo.
      placeholder: e.g. 1.27.1
    validations:
      required: true
  - type: input
    id: homey-version
    attributes:
      label: Homey model and version
      placeholder: e.g. Homey Pro (Early 2023), 12.4.0
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic report
      description: If you sent a diagnostic report from Homey (Apps → Sensibo → Send diagnostic report), paste its ID here.
